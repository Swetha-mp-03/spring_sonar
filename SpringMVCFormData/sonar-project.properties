# Required project identification
sonar.projectKey=Swetha-mp-03_spring_sonar
sonar.organization=swetha-mp-03
sonar.host.url=https://sonarcloud.io

# Authentication using token
sonar.login=${SONAR_TOKEN}

# Paths to analyze
sonar.sources=src
sonar.tests=src/test/java

# Exclude specific directories and files
sonar.exclusions=src/test/java/**/*.java,src/resources/**,target/**,build/**

# Include only Java files for analysis
sonar.inclusions=src/main/java/**/*.java

# Optional: Coverage settings if you want JaCoCo integration
sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportPaths=target/site/jacoco/jacoco.xml

# Encoding of the source files
sonar.sourceEncoding=UTF-8
